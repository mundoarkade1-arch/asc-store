<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin — ASC STORE</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css">
<style>[hidden]{display:none!important}.adm{max-width:860px;margin:auto;padding:2rem 0 5rem;width:92%}.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:1.4rem;margin-bottom:1.2rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:.9rem 0 .3rem}input[type=text],input[type=password],input[type=email],textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:#fff;border-radius:10px;padding:.65rem .9rem;font:inherit}
textarea{min-height:110px}.r{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.item{padding:.8rem 0;border-top:1px solid var(--line)}.item:first-child{border:0}.msg{color:var(--lime);min-height:1.4rem;font-size:.9rem}.err{color:#ff8a80}details{margin-top:1rem;color:var(--mut)}small{color:var(--mut)}</style></head>
<body><div class="adm">
<div class="r" style="justify-content:space-between;margin-bottom:1.5rem"><span class="logo"><span class="mark">A</span>ASC<b>ADMIN</b></span><button class="btn" id="out" hidden>Sair</button></div>
<form id="login" class="box" hidden><h2>Entrar</h2><label for="pw">Senha de administrador</label><input id="pw" type="password" autocomplete="current-password" required>
<p class="msg err" id="lmsg"></p><button class="btn pri">Entrar</button></form>
<div id="panel" hidden>
<p class="msg" id="msg" role="status"></p>
<div class="box"><div class="r" style="justify-content:space-between"><h2>Aplicativos</h2><button class="btn pri" id="new">Novo aplicativo</button></div><div id="list"></div></div>
<form id="form" class="box" hidden><h2>Dados do aplicativo</h2>
<label for="f-name">Nome</label><input type="text" id="f-name" required maxlength="60">
<label for="f-tagline">Frase curta</label><input type="text" id="f-tagline" maxlength="120">
<label for="f-description">Descrição completa</label><textarea id="f-description" maxlength="3000"></textarea>
<div class="g2"><div><label for="f-category">Categoria</label><input type="text" id="f-category" placeholder="Entretenimento"></div><div><label for="f-min">Requisito mínimo</label><input type="text" id="f-min" placeholder="Android 8.0 ou superior"></div></div>
<label for="f-repo">Repositório do GitHub com as releases (ex.: usuario/asc-cine)</label><input type="text" id="f-repo" placeholder="usuario/repositorio">
<small>Com o repositório preenchido, versão, tamanho, data, histórico e link do APK se atualizam sozinhos a cada nova release.</small>
<div class="g2"><div><label for="f-icon">Ícone (imagem quadrada)</label><input type="file" id="f-icon" accept="image/*"></div><div><label>Ícone atual</label><img id="prev" class="ico" alt="" style="width:64px;height:64px"></div></div>
<label for="f-shots">Capturas de tela (até 4; substituem as atuais)</label><input type="file" id="f-shots" accept="image/*" multiple>
<label class="r" style="color:#fff"><input type="checkbox" id="f-featured"> Mostrar em destaque na página inicial</label>
<details><summary>Sem GitHub? Preencher manualmente</summary>
<label for="f-url">Link do APK (https://...)</label><input type="text" id="f-url"><div class="g2"><div><label for="f-version">Versão</label><input type="text" id="f-version"></div><div><label for="f-size">Tamanho</label><input type="text" id="f-size" placeholder="25 MB"></div></div></details>
<div class="r" style="margin-top:1.4rem"><button class="btn pri">Salvar</button><button type="button" class="btn" id="cancel">Cancelar</button></div></form>
<div class="box"><h2>Contato do rodapé</h2><label for="email">E-mail</label><input type="email" id="email" maxlength="100"><div style="margin-top:1rem"><button class="btn" id="saveSite">Salvar e-mail</button></div></div>
</div></div><script src="admin.js"></script></body></html>
